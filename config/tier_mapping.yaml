# Market tier definitions and the starting brand->tier list.
# Tier vocabulary and classification rules: spec §12.
# Brand lists: spec §11. Target tier volumes: spec §10.
#
# THE RULE THAT MATTERS MOST (§12, §83):
#   Tier is NEVER derived from price. Price is the thing being analysed;
#   deriving tier from it makes the whole analysis circular. Tier comes
#   from brand positioning only.
#
# STATUS OF THIS FILE:
#   Every brand below is `provisional`. §11 offers these as "Potential
#   examples", not as verified classifications, and §12 requires each
#   brand to carry classification_basis, source_or_reason and
#   reviewed_date. Producing those is Stage 1.1 work and writes
#   brand_tier_mapping.csv. Nothing here has been verified yet, and
#   pretending otherwise would be the fabrication §83 forbids.

classification_rules:
  never_use_price: true                    # §12, §83
  factors:                                 # §12
    - distribution_channel
    - retailer_positioning
    - prestige_status
    - brand_positioning
    - market_perception
  document_ambiguous_cases: true           # §12
  unmapped_brand_action: flag_for_manual_review
  # §88 requires 100% tier coverage. A product whose brand is not mapped
  # is held for review, never guessed and never silently dropped.

# Output contract for Stage 1.1 (§12).
brand_tier_mapping_csv:
  path: config/brand_tier_mapping.csv
  fields:
    - brand
    - market_tier
    - classification_basis
    - source_or_reason
    - reviewed_date
  status: not_created_yet                  # Stage 1.1 deliverable

tiers:
  - key: drugstore
    display_name: Drugstore
    definition: "Mass-market distribution: drug, grocery, big-box, mass beauty retail."
    target_product_count: 300              # §10
  - key: mid_range
    display_name: Mid-range
    definition: "Affordable prestige. Above mass-market positioning, below full prestige."
    target_product_count: 125              # §10 gives a range of 100-150
    target_product_count_range: [100, 150]
  - key: high_end
    display_name: High-end
    definition: "Prestige beauty retail positioning."
    target_product_count: 250              # §10
  - key: luxury
    display_name: Luxury
    definition: "Luxury house / designer beauty positioning."
    target_product_count: 100              # §10

# §10: "Exact numbers can vary. Balanced category representation matters
# more than perfect tier counts."
tier_count_tolerance: advisory

