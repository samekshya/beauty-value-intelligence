# Candidate data sources for current US makeup product data.
# Schema derived from spec §16 (feasibility criteria + field coverage table),
# §15 (desired fields) and §14 (legal/access constraints).
#
# Populated from the Stage 1.0 feasibility study. Every entry records the URL it
# came from and the date checked (§25). Coverage figures under `measured` are
# counted from retrieved responses. Anything not measured says `unknown` -
# never an estimate.
#
# Full narrative, verbatim legal clauses and method: reports/source_feasibility_report.md

# ---- §16 FIELD COVERAGE TABLE -----------------------------------------

field_requirements:
  critical:
    - product_name
    - brand
    - category
    - retail_price
    - quantity
    - unit
    - product_url
    - retailer
  strongly_preferred:
    - rating
    - review_count
  very_useful:
    - upc_ean
  preferred:
    - description
    - finish
    - coverage
    - ingredients
    - shade

coverage_levels:
  structured: "Dedicated field carrying the value, with its unit."
  embedded:   "Value present only inside a text field (usually the product title); needs the §27-31 parser."
  absent:     "Not available at any usable reliability."
  unknown:    "Not yet measured. Never assume a level - measure it or leave it unknown."

screening:
  primary_criterion: quantity_and_unit
  rule: >
    A source that cannot reliably return product SIZE (quantity + unit) is not
    usable for this project regardless of catalogue breadth, price quality, or
    cost. Size outranks every other attribute.
  disqualifying_levels: [absent]
  coverage_targets:                        # §88
    price: 0.98
    quantity: 0.90
    tier: 1.00
    category: 1.00
    provenance: 1.00
    rating: 0.80
  targets_note: "§88: if coverage is worse than these, report it honestly rather than adjusting the target."

legal_gate:
  must_check:                              # §14
    - terms_of_use
    - robots_policy
    - permitted_automated_access
    - available_public_apis
    - affiliate_or_product_feed_availability
  prohibited_techniques:
    - captcha_bypass
    - anti_bot_circumvention
    - proxy_rotation_to_evade_blocks
    - browser_fingerprint_manipulation
    - cloudflare_bypass
    - authentication_circumvention
    - rate_limit_evasion
  on_prohibited: exclude_source
  evidence_required: >
    Legal status must quote the exact clause or robots directive read, with the
    URL and the date checked. "Probably allowed" is not a status.
  lesson_learned: >
    robots.txt is NOT permission. Ulta's robots.txt permits product pages for all
    crawlers while its terms prohibit collecting product listings and prices
    outright. Where the two disagree, the terms govern.

# ---- SOURCES -----------------------------------------------------------

sources:

  - key: brand_shopify_storefronts
    display_name: Brand-owned Shopify storefronts
    source_type: website
    status: selected_primary_partial
    access:
      method: rest_api
      endpoint_pattern: "{base_url}/products.json?limit=250"
      auth_required: false
      auth_type: none
    cost:
      model: free
    legal:
      robots_url: "per-brand robots.txt"
      automated_access_permitted: yes
      robots_directives: >
        Checked per brand 2026-08-22. Product paths not disallowed on any brand
        used. Several (Fenty Beauty, Anastasia Beverly Hills) name AI crawlers
        and grant access explicitly.
      checked_at: 2026-08-22
    coverage:
      product_name: structured
      brand: structured
      category: embedded          # product_type present but not a usable taxonomy
      retail_price: structured
      quantity: embedded          # only where sold in multiple sizes
      unit: embedded
      product_url: structured
      retailer: structured
      rating: absent
      review_count: absent
      upc_ean: absent
      description: structured
      finish: absent
      coverage_attr: absent
      ingredients: absent
      shade: embedded             # in product name or variant title
    measured:
      brands_probed: 20
      brands_reached: 19
      products_tested: 3333
      product_name_pct: 1.000
      brand_pct: 1.000
      retail_price_pct: 1.000
      product_url_pct: 1.000
      category_present_pct: 0.818
      quantity_present_pct: 0.114        # strict plausibility rules; first pass read 0.123
      quantity_with_structured_slot: 380
      quantity_by_tier:
        drugstore: 0.000                 # 0 / 1098, uniform across all 5 brands
        mid_range: 0.020                 # 12 / 593
        high_end: 0.153                  # 225 / 1471, of which MAC = 213
        luxury: 0.836                    # 143 / 171, all Tom Ford Beauty
      non_drugstore_excluding_mac_tomford: 0.013   # 24 / 1814
      shopify_grams_populated_pct: 0.557
      measured_at: 2026-08-22
      notes: >
        Size appears in the variant slot ONLY where a product is sold in more
        than one size. Single-size products (most drugstore) use
        variants=['Default Title'] and publish no size. Confirmed by a second
        retrieval method on e.l.f. and Wet n Wild product pages: no size shown
        anywhere. e.l.f. returns 404 on products.json and needs another route.
    evaluation:
      data_quality: "High for name/brand/price. Category taxonomy inconsistent and 606 products have an empty product_type."
      makeup_coverage: "Good per brand, but brand-by-brand only - no multi-brand retailer is available."
      retailer_coverage: "One offer per product (the brand's own store). §20 multi-retailer analysis not supported."
      reliability: high
      update_frequency: continuous
    us_market: true
    currency: USD
    hazards:
      - field: "variants[].grams"
        severity: critical
        note: >
          Shipping weight including packaging, populated on 55.7% of products -
          over 4x the real size coverage. Using it as net quantity would produce
          plausible, uniformly wrong price-per-unit figures that no §33
          validation rule would catch. MUST NOT be used as quantity.
    verdict: >
      Permitted, free, authoritative and reliable for name/brand/price - but it
      cannot supply quantity for the drugstore tier at all. Usable as the spine
      of the dataset only if quantity comes from elsewhere.

  - key: open_beauty_facts
    display_name: Open Beauty Facts
    source_type: bulk_dataset
    status: candidate
    access:
      method: bulk_download
      formats: [mongodb_dump, jsonl, parquet, csv]
      auth_required: false
    cost:
      model: free
    legal:
      terms_url: https://world.openbeautyfacts.org/data
      robots_url: https://world.openbeautyfacts.org/robots.txt
      automated_access_permitted: conditional
      licence: "Open Database License (structure); Database Contents License (records); CC-BY-SA (images)"
      robots_directives: >
        "User-agent: *" disallows /api, /cgi, /facets - so the live API is off
        limits to all agents. /data/ is NOT disallowed for "*". Separate blanket
        "Disallow: /" blocks exist for ClaudeBot, anthropic-ai and Claude-Web on
        both world.openbeautyfacts.org and static.openfoodfacts.org.
      checked_at: 2026-08-22
    coverage:
      quantity: unknown
      unit: unknown
    measured:
      products_tested: 0
      measured_at: null
      notes: >
        NOT MEASURED. Schema could not be confirmed because data-fields.txt is
        hosted only on domains that blanket-block this agent, and no workaround
        was sought. Secondary sources describe a `quantity` field holding net
        quantity or size, but that is second-hand and is not recorded as fact.
        Two unknowns are decisive: whether quantity is raw text or a parsed
        numeric with a unit, and what the US makeup fill rate actually is.
    verdict: >
      The single most important open question in the study. It is the only
      identified route to structured net quantity, and therefore the only
      candidate that could rescue drugstore-tier coverage. Requires a decision
      on retrieval before it can be tested.

  - key: kaggle_sephora_historical
    display_name: Historical Sephora dataset (Kaggle)
    source_type: bulk_dataset
    status: selected_supplementary
    access:
      method: bulk_download
      auth_required: true
      auth_type: account_approval
    cost:
      model: free
    legal:
      automated_access_permitted: yes
      checked_at: 2026-08-22
    coverage:
      quantity: embedded
      retail_price: structured
      ingredients: structured
      rating: structured
      review_count: structured
    measured:
      products_tested: 0
      measured_at: null
      notes: "Row count (~9,800) and licence from secondary descriptions; Kaggle pages did not render for automated fetching."
    constraints:
      - "§17: historical metadata ONLY. Store as historical_price, never current_price."
      - "Prestige/Sephora assortment - cannot cover the drugstore tier."
    verdict: >
      Supplementary, never primary. Its real value is as labelled test material
      for the §27-31 quantity parser before live data exists.

  - key: serpapi
    display_name: SerpApi
    source_type: api
    status: candidate
    access:
      method: rest_api
      auth_required: true
      auth_type: api_key
      signup_required: true
    cost:
      model: freemium
      free_tier: "250 searches/month, 50/hour"
      paid_tiers_usd_month: {25: 1000, 75: 5000, 150: 15000, 275: 30000, 725: 100000}
      approved_spend: 0
      note: "Approved for free tier only, hard stop at the free limit."
    legal:
      terms_url: https://serpapi.com/pricing
      checked_at: 2026-08-22
    coverage:
      quantity: embedded
      retail_price: structured
    measured:
      products_tested: 0
      measured_at: null
      notes: "Not measured - awaiting an API key. Size present only where a merchant puts it in the listing title."
    verdict: "Possible breadth/price fallback. Not a solution to the size problem."

  # ---- rejected ------------------------------------------------------

  - key: amazon_paapi
    display_name: Amazon Product Advertising API v5 / Creators API
    source_type: api
    status: rejected
    rejection_reason: >
      PA-API v5 deprecated and already returning HTTP 403. Successor Creators API
      requires an approved creator account and (per secondary sources,
      unconfirmed from Amazon's own docs, which sit behind a sign-in wall) at
      least 10 qualifying sales in a rolling 30 days. Access revocable on falling
      below threshold, so it cannot underpin a reproducible pipeline (§89).
    legal:
      checked_at: 2026-08-22
      checked_url: https://affiliate-program.amazon.com/creatorsapi/docs/en-us/paapiv5-deprecation

  - key: google_shopping_content_api
    display_name: Google Shopping Content API
    source_type: api
    status: rejected
    rejection_reason: >
      Wrong direction of data flow. It uploads your OWN catalogue to Merchant
      Center and cannot query other retailers' products. Never a candidate.
    legal:
      checked_at: 2026-08-22
      checked_url: https://developers.google.com/shopping-content/guides/quickstart

  - key: sephora
    display_name: Sephora
    source_type: website
    status: rejected
    rejection_reason: >
      robots.txt itself returns HTTP 403 - the file declaring crawler policy is
      not served. Site refuses automated requests at the edge. Excluded per §14;
      no circumvention attempted or proposed.
    legal:
      robots_url: https://www.sephora.com/robots.txt
      automated_access_permitted: "no"
      checked_at: 2026-08-22

  - key: ulta
    display_name: Ulta Beauty
    source_type: website
    status: rejected
    rejection_reason: >
      Terms prohibit it on two independent grounds, despite a permissive
      robots.txt.
    legal:
      terms_url: https://www.ulta.com/company/terms-and-conditions
      robots_url: https://www.ulta.com/robots.txt
      automated_access_permitted: "no"
      exact_clause: >
        Licence granted is "a limited license to access and make personal use of
        the Site and Site content only for noncommercial purposes", expressly
        excluding "any resale or commercial use of the Site; any collection and
        use of any product listings, descriptions, or prices; any derivative use
        of the Site". Separately prohibits "any use of data mining, robots, or
        similar data gathering and extraction tools".
      robots_directives: >
        "User-agent: *" disallows only /community/groups/*. Product pages are NOT
        disallowed. The permissive robots.txt does not override the terms.
      checked_at: 2026-08-22

  - key: ebay_browse_api
    display_name: eBay Browse API
    source_type: api
    status: rejected
    rejection_reason: >
      Accessible but unsuitable. Listings are seller-authored marketplace text,
      so brand, size and category are inconsistent by construction, and prices
      reflect resale rather than retail - failing §18's retail-snapshot framing.
      Size fields never confirmed; documentation timed out on three attempts.
    limits:
      rate_limit: "5,000 calls/day default; free Application Growth Check raises it"
    cost:
      model: free
    legal:
      checked_at: 2026-08-22

  - key: impact_com
    display_name: Impact.com product catalogue
    source_type: affiliate_network
    status: rejected
    rejection_reason: "Dropped by decision - approval latency unbounded, fields not documented publicly."
    legal:
      checked_at: 2026-08-22

  - key: target
    display_name: Target
    source_type: website
    status: rejected
    rejection_reason: "Terms prohibit automated navigation, data extraction tools, and systematic storage of content; licence is noncommercial personal use only."
    legal:
      terms_url: https://www.target.com/c/terms-conditions/-/N-4sr7l
      robots_url: https://www.target.com/robots.txt
      automated_access_permitted: "no"
      exact_clause: >
        Prohibits use of "any engine, software, tool, agent, data or other device
        or mechanism (including browsers, spiders, robots, avatars or intelligent
        agents) to navigate or search the Site"; "any use of data extraction,
        scraping, mining or other data gathering tools, or create a database by
        systematically downloading or storing Site content"; and "any commercial
        use of the Site or its Content, including making any collection or use
        of any product listings, descriptions, prices or images".
      robots_directives: "User-agent: * only; /p/ product pages NOT disallowed; no blanket block. robots is not permission."
      checked_at: 2026-08-22

  - key: walmart
    display_name: Walmart
    source_type: website
    status: rejected
    rejection_reason: >
      Terms of use pages serve a CAPTCHA interstitial on three URLs across two
      domains - the policy itself is not readable without circumvention.
      Prohibition corroborated by corporate-site terms and secondary sources
      but not primary-verified. No public product API for non-sellers.
    legal:
      terms_url: "https://www.walmart.com/help/article/walmart-com-terms-of-use/3b75080af40340d6bbd596f116fae5a0 (CAPTCHA)"
      robots_url: https://www.walmart.com/robots.txt
      automated_access_permitted: "no"
      exact_clause: >
        NOT READ from the retail site (CAPTCHA). corporate.walmart.com terms,
        governing that site only, prohibit "any engine, software, tool, agent or
        other device or mechanism (including without limitation browsers,
        spiders, robots, avatars or intelligent agents) to navigate or search
        this Site".
      robots_directives: "User-agent: * disallows /account/, /api/, /search, ajax paths; /ip/ product pages NOT disallowed. robots is not permission."
      checked_at: 2026-08-22

# ---- NOT ASSESSED ------------------------------------------------------
# Recorded rather than assumed. Not ruled in or out.

not_assessed:
  - key: kroger_products_api
    reason: "Developer portal timed out on four attempts across two URLs; docs are JavaScript-rendered. Mass-market assortment only."
  - key: cj_affiliate
    reason: "Product-feeds URL returned 404."
  - key: rakuten_advertising
    reason: "Not reached."
  - key: upc_gtin_lookup
    reason: "Relevant to §22 entity resolution, not to primary acquisition."

# ---- DECISION ----------------------------------------------------------

selected:
  primary: brand_shopify_storefronts
  primary_caveat: >
    Provides name, brand, price, URL and retailer at 100%, but supplies NO
    quantity for the drugstore tier. It is the spine of the dataset, not a
    complete source.
  quantity_source: UNRESOLVED
  fallback: null
  decided_at: null
  rationale: >
    Blocking issue: measured quantity coverage is 12.3% overall and 0.0% for
    drugstore, against §88's 90% target. The drugstore tier is the subject of the
    central research question (§98), so this is not a coverage shortfall to
    document - it is a gap that prevents the primary comparison. Resolution
    depends on Open Beauty Facts, which is untested, and on a decision about
    project scope. See reports/source_feasibility_report.md.
